<title>Flow figure: New, Paid, Shipped, Delivered, Cancelled. Steps: delivered, cancelled.</title>
<desc>The figure has these boxes: New, Paid, Shipped, Delivered, Cancelled.
delivered.
The customer pays. The order is paid.
The warehouse ships the order.
The carrier delivers the order. This is an end state.
cancelled.
The customer pays. The order is paid.
The customer cancels before the shipment. This is an end state.</desc>
