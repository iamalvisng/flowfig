<title>Flow figure: Request refund, Confirmation, Rejection, Order in policy?, Close ticket, Issue refund. Steps: approved, rejected.</title>
<desc>The figure has these boxes: Request refund, Confirmation, Rejection, Order in policy?, Close ticket, Issue refund.
approved.
The customer asks for a refund from the order page. Support checks the age, the item state and the reason.
The request is inside the policy.
Finance refunds the original payment method.
The customer gets the confirmation email.
rejected.
The customer asks for a refund. Support checks the order.
The request is outside the policy. The customer gets the reason.</desc>
